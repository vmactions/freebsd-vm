        prepare: |
          
          echo prepared >> "$HOME/.cache_after_prepare_count"
        run: |
          set -e
          [ "$(grep -c prepared "$HOME/.cache_after_prepare_count")" -eq 1 ]
          #pkg install -y curl
          pwd
          ls -lah
          whoami
          env
          freebsd-version
          uname -a
