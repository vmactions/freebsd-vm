            arch: ""
          - runs: "ubuntu-24.04-arm"
            arch: "riscv64"
          - runs: "ubuntu-24.04-arm"
            arch: "powerpc64"
          - runs: "ubuntu-24.04-arm"
            arch: "sparc64"
          - runs: "ubuntu-24.04-arm"
            arch: "ppc64le"
          - runs: "ubuntu-24.04-arm"
            arch: "s390x"
          - runs: "ubuntu-24.04-arm"
            arch: "i386"
          - runs: "ubuntu-24.04-arm"
            arch: "loongarch64"
          - runs: "ubuntu-24.04-arm"
            arch: "armv7"
