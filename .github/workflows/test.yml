  # One-shot tar sync (push at boot, pull at the end). This is the ONLY
  # transport the telnet guests (ReactOS, Redox, RISC OS) have, and a
  # declared-but-otherwise-untested method on the ssh guests whose builders
  # list it. ONE leg per repo, on purpose: default release, default arch --
  # tar's transport does not vary per release, so a full matrix would only
  # burn runners. The gate greps the rendered sync map JSON as a string
  # ('tar' is not a substring of any other method name); a per-arch lookup
  # would wrongly skip the repos with no x86_64 arch at all (ReactOS is
  # i386-only, RISC OS armv7-only -- their default arch comes from
  # DEFAULT_ARCH in conf/default.release.conf). The in-guest command body is
  # per-repo data (VM_TAR_RUN / VM_TAR_VERIFY in datafile.ini): the telnet
  # guests speak their own command languages, so no shared POSIX script can
  # run everywhere. A repo that defines neither still tests boot + push +
  # copyback.
  testtar:
    # Repo-level gate, same expression the steps below already use. Without it
    # the guests whose builder does not list tar still spawn this job and green
    # it with every step skipped.
    if: ${{ contains('{"x86_64":["rsync","scp","sshfs","nfs","tar"],"aarch64":["rsync","scp","sshfs","nfs","tar"],"riscv64":["nfs","scp","tar"],"powerpc64":["nfs","scp","tar"],"sparc64":[],"ppc64le":[],"s390x":[],"i386":[],"loongarch64":[],"armv7":[]}', 'tar') }}
    runs-on: ubuntu-24.04
    name: tar FreeBSD
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    # Sparse on purpose. The workspace IS the payload here, and this repo
    # commits node_modules -- 4636 of its 4662 files, 35 MB of npm packages
    # that prove nothing about the sync path. The agent guests move a few MB
    # per minute (measured: 42 MB over 9P took 4.5 min each way), so a full
    # checkout turns this job into an npm bulk-transfer benchmark -- it is
    # what left the ReactOS push without a completion marker after 12
    # minutes. The action under test is fetched into _actions, which the
    # sync excludes anyway, so it is unaffected.
    - uses: actions/checkout@v7
      with:
        sparse-checkout: |
          conf
          .github
        sparse-checkout-cone-mode: true
    - name: Test in FreeBSD
