    needs: [ testsshfs, testnfs, testscp, test, testcustomshell, testerr, testpass ]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    name: cache-after-prepare seed FreeBSD
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Test in FreeBSD
