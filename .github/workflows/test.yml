
name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.sh'
      - '.github/workflows/test.yml'
      - 'index.js'
      - 'conf/*'
      - 'hooks/*'



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



jobs:
  # The sync jobs are gated on two levels, and both are needed.
  #
  # Level 1 -- the VM_TEST_EXCLUDE_<METHOD> matrix excludes below (baked by
  # generate.yml from the same per-arch map as the step `if:`s): drop the legs
  # whose arch does not support this job's method, so they never spawn.
  #
  # Level 2 -- this job-level `if:`. When NO arch supports the method, level 1
  # strips EVERY leg, and GitHub then runs the job ONCE with all matrix values
  # empty instead of zero times (community discussion 179993, open and
  # undocumented). That leftover leg would be one more green do-nothing job, so
  # the repo-level gate turns it into a real skip. This is the string-grep form
  # used by testtar/test9p, for the same reason it is used there: no method name
  # is a substring of another method name or of any arch key in the map.
  testsshfs:
    if: ${{ contains('{"x86_64":["rsync","scp","sshfs","nfs","tar"],"aarch64":["rsync","scp","sshfs","nfs","tar"],"riscv64":["nfs","scp","tar"],"powerpc64":["nfs","scp","tar"],"sparc64":[],"ppc64le":[],"s390x":[],"i386":[],"loongarch64":[],"armv7":[]}', 'sshfs') }}
