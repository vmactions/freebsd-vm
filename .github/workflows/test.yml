        if-no-files-found: ignore

  # Skipped on RISC OS: its guest agent is not a shell and has no status
  # channel at all, so anyvm can only report that a command COMPLETED, never
  # whether it succeeded. A test whose whole point is "this must come back
  # failed" therefore cannot pass there, and pretending otherwise would just
  # bake a permanent red into that repo.
  testerr:
    if: ${{ !contains(github.repository, 'riscos') }}
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    name: test default error FreeBSD
    steps:
    # Sparse, like testtar/test9p: this job runs with the repo's DEFAULT sync,
    # which on the agent guests is the tar or 9P channel, and it would
    # otherwise ship 35 MB of committed node_modules through it just to check
    # that a failing command reports failure.
    - uses: actions/checkout@v7
      with:
        sparse-checkout: |
          conf
          .github
        sparse-checkout-cone-mode: true
    - name: Test in FreeBSD
      id: testerr
      continue-on-error: true
      uses: vmactions/freebsd-vm@759dd0c7a66278ed7f64fb287491ad787f86db58
      with:
        debug: true
        # A command that EXISTS and fails, rather than `false` or a made-up
        # name. This body is shared by every guest and the agent guests do
        # not run a POSIX shell: 9front has no /bin/false (probed live), and
        # cmd.exe has none either. An unknown NAME is worse still -- ion on
        # Redox aborts the whole line with "pipeline execution error", so the
        # `|| marker` arm never runs and the exec waits out its full timeout
        # (measured: rc 124 instead of a prompt failure). A failing `ls` is
        # reported the ordinary way by sh, rc and ion, and cmd.exe treats the
        # missing `ls` itself as a plain command failure.
        run: |
          echo this is an error
          ls /no/such/path
    - name: Verify that the previous step failed
      if: steps.testerr.outcome != 'failure'
      run: |
        echo "The step was expected to fail, but it succeeded!"
        exit 1
    - name: Verify that the previous step succeeded
      if: steps.testerr.outcome == 'failure'
      run: |
        echo "The step was expected to fail, and it failed!"
        exit 0

  testpass:
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    name: test default success FreeBSD
    steps:
    # Sparse, same reason as testerr above -- and this is the job the full
    # payload actually broke: the ReactOS push spent 12 minutes on those
    # node_modules and still had no completion marker, and the RISC OS
    # copy-back corrupted its archive at that size while the small-payload
    # tar job passed.
    - uses: actions/checkout@v7
      with:
        sparse-checkout: |
          conf
          .github
        sparse-checkout-cone-mode: true
    - name: Test in FreeBSD
      id: testpass
      continue-on-error: true
      uses: vmactions/freebsd-vm@759dd0c7a66278ed7f64fb287491ad787f86db58
      with:
        debug: true
        # No `true` and no double quotes: this body runs on every guest, and
        # the agent guests are not POSIX. 9front has no /bin/true (probed
        # live -- "file does not exist: './true'", which is exactly why this
        # job went red on plan9-vm), cmd.exe has none either, and rc treats
        # double quotes as ordinary characters rather than stripping them.
        # A bare echo is valid in sh, rc, cmd.exe and ion alike.
        run: |
          echo this is a normal command
    - name: Verify that the previous step succeeded
      if: steps.testpass.outcome != 'success'
      run: |
        echo "The step was expected to succeed, but it failed!"
        exit 1
    - name: Verify that the previous step failed
      if: steps.testpass.outcome == 'success'
      run: |
        echo "The step was expected to succeed, and it succeeded!"
        exit 0
